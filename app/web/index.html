<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="See where lakes lose soil, and plan fixes zone by zone.">
  <meta name="theme-color" content="#0E6E7E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="JalRakshak">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>JalRakshak</title>
  <link rel="manifest" href="manifest.json">

  <!--
    Start the slow downloads now, not once Flutter discovers it needs them.
    Without these the app code waits for flutter_bootstrap.js, and the icon
    font waits for the app code to run.
  -->
  <link rel="preload" href="main.dart.js" as="script">
  <!-- as="fetch": Flutter loads fonts with fetch(), so as="font" would download twice. -->
  <link rel="preload" href="assets/fonts/MaterialIcons-Regular.otf" as="fetch" crossorigin>
  <!-- Flutter's rendering engine and Roboto (Google CDNs), and the map. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://maps.googleapis.com">

  <style>
    /* Shown until Flutter draws its first frame, instead of a blank page. */
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
      background: #f4fafb; color: #0e4f5a;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity 300ms ease-out;
    }
    #splash.done { opacity: 0; pointer-events: none; }
    #splash .title { font-size: 22px; font-weight: 600; letter-spacing: 0.2px; }
    #splash .bar { width: 120px; height: 4px; border-radius: 2px; overflow: hidden; background: rgba(14, 110, 126, 0.18); }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #0e6e7e;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      #splash { background: #0b1416; color: #a6eefa; }
      #splash .bar { background: rgba(166, 238, 250, 0.16); }
      #splash .bar::after { background: #5fd5ea; }
    }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" role="progressbar" aria-label="Loading JalRakshak">
    <svg width="56" height="56" viewBox="0 0 24 24" aria-hidden="true">
      <path fill="currentColor" d="M12 2.7c-.3 0-.6.1-.8.4C9.6 5.2 5 11 5 14.7 5 18.7 8.1 22 12 22s7-3.3 7-7.3C19 11 14.4 5.2 12.8 3.1c-.2-.3-.5-.4-.8-.4Zm-3.3 12.4c.4 0 .7.3.8.7.3 1.6 1.6 2.8 3.2 2.8.4 0 .8.4.8.8s-.4.8-.8.8c-2.4 0-4.4-1.8-4.8-4.1-.1-.5.3-1 .8-1Z"/>
    </svg>
    <div class="title">JalRakshak</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.classList.add('done');
      setTimeout(function () { s.remove(); }, 350);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
